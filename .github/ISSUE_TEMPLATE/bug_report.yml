name: Bug report
description: A script fails, the checker reports something wrong, or the docs are incorrect.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or step, what you expected, and what happened instead. Paste the exact error.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: RES version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Agent, model and browser tool
      placeholder: "Claude Code, Opus 5.5, Claude in Chrome"
  - type: input
    id: node
    attributes:
      label: Node.js version
