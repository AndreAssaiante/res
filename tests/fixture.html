<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture SaaS</title>
<style>
  :root { --color-primary: #7b68ee; --color-text: #1a1a1a; --radius-md: 8px; --space-2: 8px; --shadow-card: 0 1px 2px rgba(0,0,0,.2); }
  .theme-dark { --color-bg: #191919; }
  body { font: 14px/20px system-ui, sans-serif; color: var(--color-text); margin: 0; }
  header, nav, main { padding: var(--space-2); }
  .primary { background: var(--color-primary); color: #fff; border-radius: var(--radius-md); padding: var(--space-2); border: 0; transition: background-color 120ms ease-out; }
  app-task-card { display: block; margin: 4px; padding: 12px; border-radius: var(--radius-md); box-shadow: var(--shadow-card); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; }
</style>
</head>
<body>
<header><h1>Fixture SaaS</h1><button class="icon-btn"><svg width="16" height="16"></svg></button></header>
<nav>
  <a href="/app/123/board">Board A</a>
  <a href="/app/456/board">Board B</a>
  <a href="/t/86abc1234">Task</a>
  <a href="/settings">Settings</a>
  <a href="https://external.example.com/help">Help</a>
</nav>
<main>
  <app-task-card data-testid="task-card">Write spec</app-task-card>
  <app-task-card data-testid="task-card">Review PR</app-task-card>
  <app-task-card data-testid="task-card">Ship</app-task-card>
  <button class="primary" id="save">Save</button>
  <p class="contact">Maria Silva, maria.silva@cliente.com.br</p>
  <p class="phone">(48) 99999-1234</p>
  <p class="value">R$ 1.234,56</p>
  <p class="date">2026-10-15</p>
  <img class="avatar" alt="Maria" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
</main>
<script>
  localStorage.setItem('cu_view_state', 'secret-local-value');
  window.runActions = async () => {
    await fetch('/api/v2/tasks/86abc1234?include=subtasks&page=1');
    await fetch('/graphql', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ operationName: 'UpdateTask', query: 'mutation UpdateTask { x }', variables: { id: '86abc1234', name: 'Private name' } }),
    });
    await new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/v2/lists/901314610653/tasks');
      xhr.onloadend = resolve;
      xhr.send();
    });
    await new Promise((resolve) => {
      const socket = new WebSocket('ws://fixture.test/ws');
      socket.onopen = () => socket.send(JSON.stringify({ type: 'subscribe', channel: 'list-901314610653' }));
      socket.onmessage = () => { socket.close(); resolve(); };
    });
  };
</script>
</body>
</html>
